name: Retest Action on PR Comment

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  quota-measurement:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ericmariasis/ai-gateway' && github.ref == 'refs/heads/codex/quota-v193-hosted-watch'
    uses: ./.github/workflows/quota-readiness-pair.yaml

  retest:
    if: ${{
      github.event.issue.pull_request
      && github.repository == 'theagentrouter/agent-router'
      && github.actor != 'repokitteh-read-only[bot]'
      && github.actor != 'dependabot[bot]'
      }}
    name: Retest
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
      actions: write
    steps:
      - uses: envoyproxy/toolshed/gh-actions/retest@effeefe9b275dc8056f77c0e7b1010c252167d3e # actions-v0.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
