name: OpenTelemetry E2E measurement

on:
  push:
    branches:
      - codex/otel-e2e-measurement

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: original
            revision: 9cf85059160fef9afc7a9f5aff75e7ce6cc8f0ce
          - arm: restore-only
            revision: 2e3b3740182628af9931fc8f67efd64274bd27b6
          - arm: keep-matching-pods
            revision: 967c39fec9c1907cf8a69ed0b8fcc9c1b56c517b
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          cache: false
          go-version-file: go.mod
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: e2e-test-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Run the full regular E2E suite
        env:
          EG_VERSION: v0.0.0-latest
        run: make test-e2e
