name: Upgrade readiness comparison

on:
  push:
    branches:
      - codex/upgrade-3047-readiness

permissions:
  contents: read

jobs:
  upgrade:
    name: Upgrade (${{ matrix.arm }}, trial ${{ matrix.trial }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
        arm: [parent, head]
        include:
          - arm: parent
            revision: 56bd61f8280d967a3001c3b0babb8e4640d93353
          - arm: head
            revision: e05893af0c6b08ac0347dbc777b66e5ff7ae6b43
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Select the suite revision and apply shared observations
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          git show HEAD:.github/benchmarks/upgrade-observation.patch > "$RUNNER_TEMP/upgrade-observation.patch"
          git switch --detach "$REVISION"
          test "$(git rev-parse HEAD)" = "$REVISION"
          git apply --check "$RUNNER_TEMP/upgrade-observation.patch"
          git apply "$RUNNER_TEMP/upgrade-observation.patch"
          git diff --stat
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          cache: false
          go-version-file: go.mod
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: e2e-test-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Run the full upgrade suite
        env:
          EG_VERSION: v1.8.5
          K8S_VERSION: v1.34.3
        run: make test-e2e-upgrade
